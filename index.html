<style>

/* ================= TEME ================= */
:root, [data-theme="light"] {
  --bg: #fcfcfc; --surface: #ffffff; --surface-2: #f4f4f5; --surface-3: #ececee;
  --line: #ececee; --line-2: #dcdce0;
  --text: #111113; --text-2: #4f4f57; --muted: #8e8e96;
  --red: #dc2626; --red-bg: #fdeeee; --green: #15803d; --green-bg: #e7f6ec;
  --past-bg: #eeeeef; --weekend: #f5f5f6;
  --shadow-sm: 0 1px 2px rgba(16,16,20,.04);
  --shadow: 0 1px 2px rgba(16,16,20,.04), 0 6px 20px -6px rgba(16,16,20,.08);
  --shadow-hover: 0 2px 4px rgba(16,16,20,.04), 0 14px 32px -10px rgba(16,16,20,.16);
  --shadow-lg: 0 10px 30px rgba(16,16,20,.08), 0 30px 80px -20px rgba(16,16,20,.22);
  --glass: rgba(252,252,252,.78);
  --scrim: rgba(17,17,19,.22);
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --r: 16px;
}
[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #141416; --surface-2: #1b1b1e; --surface-3: #232327;
  --line: #222226; --line-2: #2e2e33;
  --text: #f1f1f2; --text-2: #b3b3ba; --muted: #75757e;
  --red: #f87171; --red-bg: #361717; --green: #4ade80; --green-bg: #10281a;
  --past-bg: #1f1f22; --weekend: #111113;
  --shadow-sm: none;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-hover: 0 1px 0 rgba(255,255,255,.05) inset, 0 14px 32px -12px rgba(0,0,0,.7);
  --shadow-lg: 0 30px 80px -20px rgba(0,0,0,.8);
  --glass: rgba(11,11,12,.75);
  --scrim: rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow-x: hidden;
  font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
  font-feature-settings: "tnum" 0, "cv11";
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--text); color: var(--bg); }
html.theming, html.theming * { transition: background-color .35s var(--ease), border-color .35s var(--ease), color .35s var(--ease) !important; }

/* ================= OSNOVNO ================= */
.btn {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px;
  padding: 7px 13px; font-size: 14px; font-weight: 500;
  transition: transform .15s var(--ease), background .15s, border-color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--text-2); }
.btn:active { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); box-shadow: 0 4px 14px -6px rgba(0,0,0,.35); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.icon-btn {
  border: 0; background: transparent; color: var(--text-2);
  width: 34px; height: 34px; border-radius: 10px; display: inline-grid; place-items: center;
  transition: background .15s, color .15s, transform .15s var(--ease);
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.mini {
  border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px;
  display: inline-grid; place-items: center; border-radius: 6px; font-size: 15px; line-height: 1; padding: 0;
  transition: background .12s, color .12s;
}
.mini svg { width: 14px; height: 14px; }
.mini:hover { color: var(--text); background: var(--surface-3); }
.mini.del:hover { color: var(--red); }
input[type="text"], input[type="password"], input[type="date"], input[type="search"], input:not([type]), select, textarea {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px;
  padding: 8px 11px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--text) 8%, transparent); }
[data-theme="dark"] input[type="date"] { color-scheme: dark; }
kbd {
  font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--surface);
}
.red { color: var(--red) !important; }
.logo {
  width: 18px; height: 18px; border-radius: 6px; background: var(--text); display: inline-block; position: relative;
}
.logo::after { content: ""; position: absolute; inset: 5px 4px 5px 4px; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(-45deg) translate(1px,-1px); width: 9px; height: 5px; inset: auto; left: 4px; top: 5px; }
.logo.big { width: 44px; height: 44px; border-radius: 14px; margin: 0 auto 6px; }
.logo.big::after { left: 12px; top: 13px; width: 18px; height: 10px; border-width: 0 0 3px 3px; }

/* ================= PRIJAVA ================= */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-box { width: 100%; max-width: 300px; display: grid; gap: 12px; text-align: center; animation: rise .5s var(--ease) both; }
.login-box h1 { font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; font-size: 22px; }
.login-box button { border: 0; background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px; font-weight: 500; }
.login-msg { min-height: 1.4em; margin: 0; color: var(--muted); font-size: 13px; }

/* ================= GORNJA TRAKA ================= */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px; padding: 10px 20px;
  background: var(--glass); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.02em; font-size: 16px; min-width: 120px; }
.seg {
  position: relative; display: flex; padding: 3px; gap: 2px;
  background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line);
}
.seg-ind {
  position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 9px;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px var(--line);
  transition: transform .38s var(--spring), width .38s var(--ease);
}
.seg-btn {
  position: relative; z-index: 1; border: 0; background: transparent; color: var(--muted);
  padding: 6px 14px; border-radius: 9px; font-size: 14px; font-weight: 500; transition: color .2s;
}
.seg-btn.active { color: var(--text); }
.seg-btn:hover { color: var(--text); }
.search {
  display: flex; align-items: center; gap: 8px; flex: 0 1 300px; margin-left: auto;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px;
  transition: border-color .2s, background .2s, flex-basis .3s var(--ease), box-shadow .2s;
}
.search:focus-within { background: var(--surface); border-color: var(--line-2); flex-basis: 380px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--text) 6%, transparent); }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search input { border: 0 !important; background: transparent !important; box-shadow: none !important; padding: 8px 0; font-size: 14px; }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }
.search:focus-within kbd { opacity: 0; }
.top-right { display: flex; align-items: center; gap: 4px; }
[data-theme="light"] .i-sun, [data-theme="dark"] .i-moon { display: none; }
.icon-btn .i-sun, .icon-btn .i-moon { animation: spinIn .45s var(--spring); }
.only-m { display: none !important; }

/* ================= SAT ================= */
.clock { width: 40px; height: 40px; margin-right: 6px; }
.clock .face { fill: var(--surface); stroke: var(--line-2); stroke-width: 2; }
.clock .tick { stroke: var(--muted); stroke-width: 1.2; }
.clock .tick.big { stroke: var(--text); stroke-width: 2.6; }
.clock .h { stroke: var(--text); stroke-width: 5; }
.clock .m { stroke: var(--text); stroke-width: 3.2; }
.clock .s { stroke: var(--red); stroke-width: 1.4; }
.clock .pin { fill: var(--text); stroke: none; }

/* ================= RASPORED ================= */
.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); }
.app[data-view="tasks"] .layout { grid-template-columns: 260px minmax(0, 1fr); }
.sidebar { display: none; }
.app[data-view="tasks"] .sidebar { display: block; }
.main { min-width: 0; padding: 28px 32px 48px; }
.main.view-in > * { animation: rise .45s var(--ease) both; }
.status { padding: 6px 20px 12px; font-size: 11px; color: var(--muted); text-align: right; }

/* ================= SIDEBAR ================= */
.sidebar {
  border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 61px;
  height: calc(100vh - 61px); overflow: auto; background: var(--bg);
}
.side-head {
  display: flex; align-items: center; justify-content: space-between;
  color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
  padding: 0 10px; margin: 18px 0 6px;
}
.srow {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; cursor: pointer;
  font-size: 14px; color: var(--text-2); position: relative;
  transition: background .15s, color .15s, transform .2s var(--ease), box-shadow .2s;
}
.srow:hover { background: var(--surface-2); color: var(--text); }
.srow.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line), var(--shadow-sm); }
.srow .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .count { color: var(--muted); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.srow .acts { display: none; gap: 0; }
.srow:hover .acts { display: flex; }
.srow:hover .count { display: none; }
@media (hover: none) { .srow.active .acts { display: flex; } .srow.active .count { display: none; } }
.cat-row { font-weight: 600; color: var(--text); margin-top: 2px; }
.area-row { padding-left: 14px; }
.area-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; transition: background .2s, transform .2s var(--spring); }
.area-row.active .dot { background: var(--text); transform: scale(1.3); }
.side-empty { color: var(--muted); font-size: 13px; padding: 8px 10px; line-height: 1.45; }
.is-dragging [data-drop-area] { transition: background .15s, box-shadow .15s, transform .2s var(--spring); }
.srow.drop-hover { background: var(--text); color: var(--bg); transform: translateX(4px); }
.srow.drop-hover .dot { background: var(--bg); }
.srow.drop-hover .count { color: var(--bg); }
.side-back { display: none; }

/* ================= ZAGLAVLJA ================= */
.page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head h2 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; }
.page-head .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.page-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px;
  font-size: 12.5px; font-weight: 500; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line);
}
.pill.red { background: var(--red-bg); border-color: transparent; }
.pill.green { background: var(--green-bg); color: var(--green); border-color: transparent; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ================= GRUPE I KARTICE ================= */
.group { margin-bottom: 34px; }
.group-head { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.group-head h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }
.group-head .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-head .line { flex: 1; height: 1px; background: var(--line); }
.group-head.red h3 { color: var(--red); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; border-radius: var(--r); transition: background .2s, box-shadow .2s; }
.grid.drop-hover { background: var(--surface-2); box-shadow: 0 0 0 2px var(--surface-2); }

.card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 14px 12px; box-shadow: var(--shadow); cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; outline: none;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s, opacity .3s;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--line-2); }
.card:focus-visible { box-shadow: 0 0 0 2px var(--text); }
.card.enter { animation: cardIn .5s var(--ease) both; animation-delay: calc(min(var(--i, 0), 14) * 28ms); }
.card.dragging { opacity: .35; transform: scale(.97); }
.card.completing { animation: complete .45s var(--ease) forwards; pointer-events: none; }
.card-meta { display: flex; align-items: center; gap: 8px; min-height: 18px; font-size: 12px; color: var(--muted); }
.card-meta .crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta .sp { flex: 1; }
.due {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; white-space: nowrap;
  color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums;
}
.due svg { width: 12px; height: 12px; }
.due.red { color: var(--red); background: var(--red-bg); }
.card-title { display: flex; align-items: flex-start; gap: 10px; }
.card-title h4 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; word-break: break-word; flex: 1; padding-top: 1px; }
.card.done .card-title h4 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.card.done { opacity: .62; }

/* okrugli check */
.tick {
  flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid var(--line-2); background: transparent;
  display: inline-grid; place-items: center; padding: 0; margin-top: 1px; color: transparent;
  transition: border-color .15s, background .2s var(--ease), color .15s, transform .25s var(--spring);
}
.tick svg { width: 12px; height: 12px; stroke-width: 3; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s var(--ease) .05s; }
.tick:hover { border-color: var(--text-2); color: var(--muted); }
.tick:hover svg { stroke-dashoffset: 0; }
.tick:active { transform: scale(.85); }
.tick.on { background: var(--text); border-color: var(--text); color: var(--bg); animation: pop .35s var(--spring); }
.tick.on svg { stroke-dashoffset: 0; }
.tick.sm { width: 16px; height: 16px; border-width: 1.5px; margin-top: 2px; }
.tick.sm svg { width: 10px; height: 10px; }

.peek { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }
.peek li {
  display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: var(--text-2); padding: 3px 4px 3px 2px; margin-left: 2px; border-radius: 8px;
  transition: background .15s, opacity .3s, transform .3s var(--ease), max-height .35s var(--ease);
  max-height: 60px; overflow: hidden;
}
.peek li:hover { background: var(--surface-2); }
.peek li .pt { flex: 1; min-width: 0; position: relative; overflow-wrap: anywhere; }
.peek li .pt::after { content: ""; position: absolute; left: 0; top: 50%; height: 1.5px; width: 0; background: var(--muted); transition: width .3s var(--ease); }
.peek li.checked .pt { color: var(--muted); }
.peek li.checked .pt::after { width: 100%; }
.peek li.gone { opacity: 0; transform: translateX(8px); max-height: 0; padding-top: 0; padding-bottom: 0; }
.more { font-size: 12px; color: var(--muted); padding-left: 29px; }
.card-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); border-radius: 4px; transition: width .6s var(--ease); }

/* brzo dodavanje */
.quick {
  border: 1.5px dashed var(--line-2); border-radius: var(--r); display: flex; align-items: center; gap: 8px; padding: 0 12px;
  min-height: 52px; color: var(--muted); transition: border-color .2s, background .2s;
}
.quick:hover { border-color: var(--muted); }
.quick:focus-within { border-style: solid; border-color: var(--text-2); background: var(--surface); box-shadow: var(--shadow); }
.quick svg { width: 16px; height: 16px; flex: none; }
.quick input { border: 0 !important; background: transparent !important; box-shadow: none !important; padding: 12px 0; font-size: 14px; }
.hint-line { font-size: 12.5px; color: var(--muted); margin-top: -14px; margin-bottom: 20px; }

.empty {
  border: 1.5px dashed var(--line-2); border-radius: 20px; padding: 44px 24px; text-align: center; color: var(--muted);
  animation: rise .5s var(--ease) both;
}
.empty b { display: block; color: var(--text); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }
.empty-hint { color: var(--muted); font-size: 13px; padding: 4px; }

/* ================= FOKUS ================= */
.hello .date-big { font-size: 30px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; }
.hello .date-big span { color: var(--muted); font-weight: 500; }
.focus-wrap { max-width: 1180px; margin: 0 auto; }

/* ================= DRAWER (detalji kartice) ================= */
.drawer-back {
  position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; z-index: 40;
  transition: opacity .3s var(--ease); backdrop-filter: blur(2px);
}
.drawer {
  position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(520px, calc(100vw - 20px)); z-index: 41;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg);
  transform: translateX(calc(100% + 30px)); transition: transform .45s var(--ease), visibility 0s .45s; visibility: hidden;
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer-open .drawer-back { opacity: 1; pointer-events: auto; }
.drawer-open .drawer { transform: none; visibility: visible; transition: transform .45s var(--ease), visibility 0s; }
.dr-head { display: flex; align-items: center; gap: 6px; padding: 14px 14px 0 20px; }
.dr-head .sp { flex: 1; }
.crumb-select {
  width: auto !important; border: 0 !important; background: var(--surface-2) !important; border-radius: 999px !important;
  padding: 4px 26px 4px 12px !important; font-size: 12.5px; color: var(--text-2); cursor: pointer; box-shadow: none !important;
  appearance: none; -webkit-appearance: none; max-width: 260px; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%) !important;
  background-position: calc(100% - 13px) 52%, calc(100% - 9px) 52% !important; background-size: 4px 4px !important; background-repeat: no-repeat !important;
}
.dr-body { flex: 1; overflow: auto; padding: 10px 24px 24px; overscroll-behavior: contain; }
.dr-body > * { animation: rise .4s var(--ease) both; }
.dr-body > *:nth-child(2) { animation-delay: .03s; } .dr-body > *:nth-child(3) { animation-delay: .06s; }
.dr-body > *:nth-child(4) { animation-delay: .09s; } .dr-body > *:nth-child(n+5) { animation-delay: .12s; }
.drawer.static .dr-body > * { animation: none; }
.dr-title {
  display: block; width: 100%; border: 0 !important; background: transparent !important; box-shadow: none !important; padding: 4px 0 !important;
  font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; resize: none; overflow: hidden;
}
.props { display: grid; grid-template-columns: 70px 1fr; gap: 10px 12px; align-items: center; margin: 14px 0 18px; font-size: 13px; }
.props .lbl { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--text-2);
  transition: background .15s, color .15s, border-color .15s, transform .15s var(--ease);
}
.chip:hover { border-color: var(--text-2); color: var(--text); }
.chip:active { transform: scale(.94); }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.chip-date { position: relative; }
.chip-date input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; padding: 0; }
.chip-date input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; color: var(--text-2); }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .tr { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background .25s var(--ease); flex: none; }
.switch .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--spring); }
.switch input:checked + .tr { background: var(--text); }
.switch input:checked + .tr::after { transform: translateX(14px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--text); outline-offset: 2px; }
.dr-progress { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.dr-progress .bar { height: 6px; }

.chapter { border-top: 1px solid var(--line); padding: 10px 0 8px; }
.ch-head { display: flex; align-items: center; gap: 4px; }
.chev { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; padding: 0; flex: none; }
.chev svg { width: 14px; height: 14px; transition: transform .3s var(--ease); transform: rotate(90deg); }
.chapter.collapsed .chev svg { transform: rotate(0); }
.chev:hover { background: var(--surface-2); color: var(--text); }
.ch-title { flex: 1; font-weight: 600; font-size: 15px; border-color: transparent !important; background: transparent !important; padding: 4px 6px !important; box-shadow: none !important; }
.ch-title:hover { background: var(--surface-2) !important; }
.ch-title:focus { background: var(--surface-2) !important; }
.ch-count { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 0 4px; }
.ch-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s var(--ease), opacity .25s; }
.ch-body > div { overflow: hidden; }
.chapter.collapsed .ch-body { grid-template-rows: 0fr; opacity: 0; }
.chapter .mini.del, .task .mini.del { opacity: 0; transition: opacity .15s; }
.chapter .ch-head:hover .mini.del, .task:hover .mini.del, .task:focus-within .mini.del { opacity: 1; }
@media (hover: none) { .chapter .mini.del, .task .mini.del { opacity: .6; } }
.tasks { list-style: none; margin: 4px 0 0; padding: 0 0 0 28px; }
.task { display: flex; align-items: center; gap: 8px; padding: 1px 0; border-radius: 8px; animation: rise .3s var(--ease) both; }
.task .tick { margin-top: 0; }
.t-text { flex: 1; border-color: transparent !important; background: transparent !important; padding: 5px 6px !important; box-shadow: none !important; font-size: 14px; transition: color .2s; }
.t-text:hover, .t-text:focus { background: var(--surface-2) !important; }
.task.done .t-text { color: var(--muted); text-decoration: line-through; }
.add-line {
  border: 0 !important; background: transparent !important; box-shadow: none !important; color: var(--muted);
  padding: 6px 6px !important; font-size: 14px;
}
.add-line::placeholder { color: var(--muted); }
.add-line:focus { background: var(--surface-2) !important; color: var(--text); }
.task-add { margin-left: 28px; width: calc(100% - 28px) !important; }
.chapter-add { margin-top: 6px; border-top: 1px solid var(--line) !important; border-radius: 0 !important; padding-top: 12px !important; font-weight: 500; }
.dr-note { margin-top: 18px; }
.dr-note .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.dr-note textarea { min-height: 80px; resize: vertical; background: var(--surface-2); border-color: transparent; line-height: 1.5; }
.dr-note textarea:focus { background: var(--surface); }
.dr-foot { padding: 10px 20px 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dr-foot .sp { flex: 1; }

/* ================= MODAL ================= */
.modal-back {
  position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 60;
  animation: fade .2s var(--ease) both; backdrop-filter: blur(3px);
}
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow: auto;
  padding: 22px; box-shadow: var(--shadow-lg); animation: modalIn .35s var(--spring) both;
}
.modal-back.closing { animation: fade .18s var(--ease) reverse both; }
.modal-back.closing .modal { animation: modalOut .18s var(--ease) both; }
.modal h3 { margin: 0 0 16px; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
.modal .field { display: grid; gap: 5px; margin-bottom: 12px; }
.modal .field span { font-size: 12px; color: var(--muted); font-weight: 500; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.modal p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.menu-list { display: grid; gap: 2px; }
.menu-list button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-size: 14px; transition: background .15s; }
.menu-list button:hover { background: var(--surface-2); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; color: var(--text-2); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.keys kbd { justify-self: start; }

/* ================= TOAST ================= */
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px;
  background: var(--text); color: var(--bg); border-radius: 14px; font-size: 14px; box-shadow: var(--shadow-lg);
  animation: toastIn .4s var(--spring) both;
}
.toast button { border: 0; background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); border-radius: 9px; padding: 5px 11px; font-weight: 600; font-size: 13px; }
.toast button:hover { background: color-mix(in srgb, var(--bg) 26%, transparent); }
.toast.out { animation: toastOut .25s var(--ease) both; }

/* ================= KALENDAR ================= */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.cal-head h2 { margin: 0 auto 0 0; font-size: 26px; font-weight: 650; letter-spacing: -.025em; }
.cal-head h2 span { color: var(--muted); font-weight: 500; }
.cal-box { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.cal-dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.cal-dow { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 10px 10px 8px; }
.cal-dow.we { background: var(--weekend); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-grid.slide-next { animation: slideL .4s var(--ease) both; }
.cal-grid.slide-prev { animation: slideR .4s var(--ease) both; }
.cal-grid.fadein { animation: fade .4s var(--ease) both; }
.day {
  min-height: 108px; padding: 7px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 3px; min-width: 0; position: relative; cursor: pointer;
  transition: background .2s;
}
.day:nth-child(7n) { border-right: 0; }
.day.lastrow { border-bottom: 0; }
.day:hover { background: var(--surface-2); }
.day.we, .day.hol { background: var(--weekend); }
.day.vac { background: var(--green-bg); }
.day.vac .num { color: var(--green); font-weight: 600; }
.day.vac.past { background: var(--past-bg); }
.day.vac.past .num { color: var(--muted); font-weight: 400; }
.day.other .num, .day.other .lbl, .day.other .ev { opacity: .4; }
.day .top { display: flex; align-items: center; justify-content: space-between; }
.day .num { font-size: 13px; font-variant-numeric: tabular-nums; width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 50%; }
.day .plus { opacity: 0; color: var(--muted); font-size: 16px; line-height: 1; transition: opacity .15s, transform .2s var(--spring); transform: scale(.6); }
.day:hover .plus { opacity: 1; transform: none; }
.day.today .num { background: var(--text); color: var(--bg) !important; font-weight: 600; animation: pop .5s var(--spring) .2s both; }
.day .lbl { font-size: 11px; color: var(--muted); line-height: 1.25; }
.day .lbl.vac-l { color: var(--green); font-weight: 500; }
.day.past .lbl.vac-l { color: var(--muted); }
.day .ev {
  font-size: 11.5px; line-height: 1.3; color: var(--red); cursor: pointer; font-weight: 500;
  border: 0; background: var(--red-bg); border-radius: 6px; padding: 2px 6px; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform .15s var(--ease);
}
.day .ev:hover { transform: translateX(2px); }
.day .ev.calm { color: var(--text-2); background: var(--surface-3); }
.day .ev.done { color: var(--muted); background: transparent; text-decoration: line-through; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line-2); }

.cal-side section { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.cal-side h3 { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; }
.vac-form { display: grid; gap: 8px; margin-bottom: 10px; }
.vac-form .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 6px; }
.vac-form input[type="date"] { padding: 7px 6px; font-size: 13px; }
.vac-list, .up-list { list-style: none; margin: 0; padding: 0; }
.vac-list li, .up-list li { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; animation: rise .3s var(--ease) both; }
.vac-list .what { flex: 1; color: var(--green); font-weight: 500; }
.vac-list li.past .what { color: var(--muted); font-weight: 400; }
.vac-list small, .up-list small { color: var(--muted); display: block; font-weight: 400; }
.up-list li { cursor: pointer; border-radius: 8px; transition: background .15s, padding .2s var(--ease); }
.up-list li:hover { background: var(--surface-2); padding-left: 8px; padding-right: 8px; }
.up-list .what { flex: 1; overflow: hidden; text-overflow: ellipsis; }

/* ================= ANIMACIJE ================= */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes complete { 40% { transform: scale(1.02); } to { opacity: 0; transform: scale(.94) translateY(6px); } }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes modalOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes slideL { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
@keyframes spinIn { from { opacity: 0; transform: rotate(-90deg) scale(.5); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}

/* ================= TELEFON / TABLET ================= */
@media (max-width: 1100px) {
  .cal-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .topbar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; padding-top: max(8px, env(safe-area-inset-top)); }
  .brand { display: none; }
  .only-m { display: inline-grid !important; }
  .app:not([data-view="tasks"]) .side-toggle { display: none !important; }
  .seg { order: 1; flex: 1 1 auto; min-width: 0; }
  .seg-btn { flex: 1; padding: 6px 4px !important; font-size: 13.5px; }
  .top-right { order: 2; gap: 0; }
  .dr-foot { display: none; }
  .page-head .right { margin-left: 0; width: 100%; }
  .hello .right .btn { width: 100%; justify-content: center; }
  .search { order: 3; flex: 1 1 100%; margin: 0; }
  .search:focus-within { flex-basis: 100%; }
  .search kbd { display: none; }
  .clock { width: 32px; height: 32px; margin-right: 0; }
  .seg-btn { padding: 6px 11px; }
  .app[data-view="tasks"] .layout { grid-template-columns: minmax(0, 1fr); }
  .app .sidebar {
    display: block; position: fixed; top: 0; left: 0; bottom: 0; width: 290px; max-width: 86vw; height: auto; z-index: 45;
    border-right: 1px solid var(--line); box-shadow: var(--shadow-lg); padding-top: max(20px, env(safe-area-inset-top));
    transform: translateX(-105%); transition: transform .4s var(--ease); background: var(--surface);
  }
  .side-open .app .sidebar { transform: none; }
  .side-back { display: block; position: fixed; inset: 0; z-index: 44; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .side-open .side-back { opacity: 1; pointer-events: auto; }
  .main { padding: 18px 14px 40px; }
  .page-head h2, .cal-head h2 { font-size: 22px; }
  .hello .date-big { font-size: 24px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .card:hover { transform: none; }
  .drawer {
    top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: 92vh; border-radius: 22px 22px 0 0;
    transform: translateY(105%);
  }
  .dr-head::before { content: ""; position: absolute; left: 50%; top: 7px; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line-2); }
  .dr-head { padding-top: 20px; }
  .dr-body { padding: 8px 18px 24px; }
  .props { grid-template-columns: 1fr; gap: 6px; }
  .props .lbl { margin-top: 6px; }
  .day { min-height: 62px; padding: 4px; }
  .day .lbl, .day .plus { display: none; }
  .day .ev { font-size: 0; padding: 0; height: 5px; border-radius: 3px; background: var(--red); }
  .day .ev.calm { background: var(--muted); }
  .day .ev.done { background: var(--line-2); }
  .cal-dow { padding: 8px 4px; font-size: 10px; text-align: center; }
  .day .top { justify-content: center; }
  .toasts { bottom: max(16px, env(safe-area-inset-bottom)); width: calc(100% - 24px); }
  .toast { width: 100%; justify-content: space-between; }
}


/* ================= PLATOM ================= */
.wordmark { font-weight: 500; letter-spacing: -.02em; }
.wordmark b { font-weight: 750; }
.brand .wordmark { font-size: 17px; }
.login-box h1.wordmark { font-size: 26px; font-weight: 500; }
.ico { width: 16px; height: 16px; flex: none; color: var(--muted); }
.muted { color: var(--muted); }
mark { background: color-mix(in srgb, var(--text) 14%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.strike { text-decoration: line-through; color: var(--muted); }
.lang-btn span { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 4px; line-height: 1.2; }
.pop { position: fixed; z-index: 95; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; display: grid; min-width: 170px; animation: modalIn .25s var(--spring) both; }
.pop button { display: flex; gap: 10px; align-items: center; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; text-align: left; font-size: 14px; }
.pop button b { font-size: 11px; width: 24px; color: var(--muted); }
.pop button:hover { background: var(--surface-2); }
.pop button.on { background: var(--surface-2); font-weight: 600; }
.pop button.on b { color: var(--text); }
.bar.thin { height: 3px; }
.bar.thick { height: 8px; border-radius: 8px; }
.bar.thick i { border-radius: 8px; }

/* --- sidebar: kategorije kao kartice --- */
.app[data-view="tasks"] .layout { grid-template-columns: 290px minmax(0, 1fr); }
.scards { display: grid; gap: 8px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); transition: border-color .2s, box-shadow .2s, transform .2s var(--ease); overflow: hidden; }
.scard:hover { border-color: var(--line-2); }
.scard.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.sc-top { display: flex; align-items: center; gap: 8px; padding: 10px 6px 8px 12px; cursor: pointer; }
.sc-ico svg { width: 17px; height: 17px; color: var(--text-2); display: block; }
.sc-top .name { flex: 1; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frac { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sc-top .acts, .sc-row .acts { display: none; }
.sc-top:hover .acts { display: flex; }
.sc-top:hover .frac { display: none; }
@media (hover: none) { .scard.active .sc-top .acts { display: flex; } }
.scard .chev svg { transform: rotate(0); }
.scard.open .chev svg { transform: rotate(90deg); }
.sc-bar { margin: 0 12px 10px; height: 4px; }
.sc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.sc-body > div { overflow: hidden; }
.scard.open .sc-body { grid-template-rows: 1fr; }
.scard.open .sc-body > div { padding: 0 6px 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.sc-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 2px 6px; padding: 6px 8px; border-radius: 9px; cursor: pointer; font-size: 13.5px; color: var(--text-2); transition: background .15s; }
.sc-row:hover { background: var(--surface-2); color: var(--text); }
.sc-row:hover .acts { display: flex; }
.sc-row:hover .frac { display: none; }
.sc-row.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.sc-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-row .bar { grid-column: 1 / -1; }
.sc-row.drop-hover { background: var(--text); color: var(--bg); }
.sc-empty a, .sc-meta { display: block; font-size: 12.5px; color: var(--muted); padding: 5px 8px; text-decoration: none; }
.sc-empty a:hover { color: var(--text); }

/* --- centralne kartice kategorija i oblasti --- */
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: -8px 0 10px; flex-wrap: wrap; animation: rise .3s var(--ease) both; }
.crumbs button { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; border-radius: 6px; margin: 0 -6px; }
.crumbs button:hover { color: var(--text); background: var(--surface-2); }
.crumbs b { color: var(--text-2); font-weight: 600; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; align-items: stretch; }
.ccard {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow);
  cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 150px; text-align: left;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s;
}
.ccard:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--line-2); }
.ccard.enter { animation: cardIn .5s var(--ease) both; animation-delay: calc(min(var(--i, 0), 14) * 40ms); }
.cc-head { display: flex; align-items: flex-start; gap: 12px; }
.cc-ico { width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.cc-ico svg { width: 20px; height: 20px; color: var(--text); }
.cc-head > div { flex: 1; min-width: 0; }
.cc-head h4 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.015em; line-height: 1.25; }
.cc-head small { color: var(--muted); font-size: 12.5px; }
.cc-frac { font-size: 13px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.cc-lines { display: grid; gap: 4px; font-size: 13.5px; color: var(--text-2); }
.cc-lines div { display: flex; gap: 8px; }
.cc-lines span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-lines small { color: var(--muted); font-variant-numeric: tabular-nums; }
.cc-next { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ccard .card-foot { margin-top: auto; }
.add-tile { border-style: dashed; border-width: 1.5px; border-color: var(--line-2); background: transparent; box-shadow: none; align-items: center; justify-content: center; color: var(--muted); font: inherit; font-weight: 500; gap: 8px; }
.add-tile svg { width: 22px; height: 22px; }
.add-tile:hover { color: var(--text); border-color: var(--muted); }
.acard.drop-hover { border-color: var(--text); box-shadow: 0 0 0 2px var(--text); }
.area-prog { display: flex; align-items: center; gap: 10px; }
.area-prog .bar { width: 140px; flex: none; }

/* --- polje za datum + kalendar za izbor --- */
.dfield { display: inline-flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 11px; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
.dfield:hover { border-color: var(--text-2); }
.dfield svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.dfield .ph { color: var(--muted); }
.dfield.open { border-color: var(--text-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--text) 8%, transparent); }
.dp { position: fixed; z-index: 90; width: 292px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 12px; animation: modalIn .28s var(--spring) both; user-select: none; }
.dp-head { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.dp-head b { flex: 1; font-size: 15px; font-weight: 650; padding-left: 6px; }
.dp-head b span { color: var(--muted); font-weight: 500; }
.dp-dows, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dp-dows span { font-size: 10.5px; font-weight: 600; color: var(--muted); text-align: center; padding: 4px 0; text-transform: uppercase; }
.dp-dows span.we { color: var(--text-2); }
.dp-d { border: 0; background: transparent; height: 36px; border-radius: 10px; font-size: 13.5px; font-variant-numeric: tabular-nums; display: grid; place-items: center; position: relative; transition: background .12s, transform .15s var(--ease); }
.dp-d:hover { background: var(--surface-3); }
.dp-d:active { transform: scale(.9); }
.dp-d.we, .dp-d.hol { background: var(--weekend); color: var(--text-2); }
.dp-d.hol::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
.dp-d.vac { background: var(--green-bg); color: var(--green); }
.dp-d.other { opacity: .35; }
.dp-d.today { box-shadow: inset 0 0 0 1.5px var(--text); font-weight: 600; }
.dp-d.inrange { background: color-mix(in srgb, var(--text) 10%, var(--surface)); color: var(--text); }
.dp-d.sel { background: var(--text) !important; color: var(--bg) !important; font-weight: 600; }
.dp-foot { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.dp-foot .sp { flex: 1; }
.dp-grid.slide-next { animation: slideL .3s var(--ease) both; }
.dp-grid.slide-prev { animation: slideR .3s var(--ease) both; }

/* --- forme --- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.tile { display: grid; gap: 4px; text-align: left; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 14px; padding: 12px; position: relative; transition: border-color .15s, transform .15s var(--ease), box-shadow .2s; cursor: pointer; }
.tile:hover { border-color: var(--text-2); }
.tile:active { transform: scale(.97); }
.tile svg { width: 20px; height: 20px; }
.tile b { font-size: 14px; font-weight: 600; }
.tile small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tile.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.tile input { position: absolute; opacity: 0; pointer-events: none; }
.segf { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.segf button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 6px 8px; font-size: 13px; font-weight: 500; color: var(--muted); transition: background .2s, color .2s; }
.segf button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.modal .two, .two2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal.wide { max-width: 540px; }
.date-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.date-chips .chip { display: inline-flex; align-items: center; gap: 4px; }
.date-chips .chip button { border: 0; background: transparent; padding: 0; color: inherit; opacity: .6; display: grid; }
.date-chips .chip button svg { width: 12px; height: 12px; }
.fade-in { animation: rise .3s var(--ease) both; }
.hint { font-size: 12.5px; color: var(--muted); margin: -4px 0 10px; }
.fx-group { display: grid; gap: 10px; margin: 14px 0; }
.fx-group small { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.switch.xs { font-size: 12px; color: var(--muted); gap: 6px; margin-right: 6px; }
.switch.xs .tr { width: 28px; height: 16px; }
.switch.xs .tr::after { width: 12px; height: 12px; }
.switch.xs input:checked + .tr::after { transform: translateX(12px); }

/* --- Fokus --- */
.focus-wrap { max-width: 1240px; }
.focus-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.focus-main, .focus-side { display: grid; gap: 16px; min-width: 0; }
.widgets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 16px 10px; animation: cardIn .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); min-width: 0; }
.w-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.w-head svg { width: 18px; height: 18px; color: var(--text-2); }
.w-head h3 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; }
.w-sum { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.w-sub { display: flex; gap: 8px; align-items: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 0 2px; }
.w-sub span { font-weight: 500; }
.w-sub.red { color: var(--red); }
.w-empty { color: var(--muted); font-size: 13.5px; padding: 10px 2px 14px; }
.w-note { font-size: 13px; color: var(--muted); padding: 6px 2px; }
.w-note b { color: var(--text-2); font-weight: 550; }
.w-more { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 8px 2px 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.w-more:hover { color: var(--text); }
.ritems { list-style: none; margin: 0; padding: 0; }
.ritem { display: flex; align-items: center; gap: 10px; padding: 8px 6px; margin: 0 -6px; border-radius: 10px; cursor: pointer; transition: background .15s, opacity .3s, transform .3s var(--ease), max-height .35s var(--ease); max-height: 80px; overflow: hidden; }
.ritem:hover { background: var(--surface-2); }
.ritem .rt { flex: 1; min-width: 0; }
.ritem .rt b { display: block; font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .rt small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.ritem.checked .rt b { color: var(--muted); text-decoration: line-through; }
.ritem.gone { opacity: 0; transform: translateX(10px); max-height: 0; padding-top: 0; padding-bottom: 0; }
.ritem .tick { margin-top: 0; }
.vac-hero { display: flex; align-items: baseline; gap: 10px; padding: 4px 0 8px; cursor: pointer; }
.vac-hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; color: var(--green); line-height: 1; }
.vac-hero span { color: var(--text-2); font-size: 14px; }
.goal-line { display: grid; gap: 4px; margin: 2px 0 10px; }
.goal-line small { color: var(--muted); font-size: 12px; }
.loan { padding: 10px 0 12px; border-top: 1px solid var(--line); cursor: pointer; }
.widget .loan:first-of-type { border-top: 0; padding-top: 2px; }
.loans { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 22px; }
.loans .loan { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.loan-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.loan-top b { flex: 1; font-weight: 600; }
.loan-top .pct { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.loan-nums { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.loan-nums small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
.loan-nums .r { text-align: right; }
.loan-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bk { display: flex; gap: 12px; align-items: center; padding: 8px 0; cursor: pointer; }
.bk .rt { flex: 1; min-width: 0; display: grid; gap: 3px; }
.bk .rt b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk .rt small { font-size: 12px; color: var(--muted); }
.bk-cover { width: 36px; height: 50px; border-radius: 4px 7px 7px 4px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; box-shadow: inset 3px 0 0 rgba(255,255,255,.18), var(--shadow); }
.bk-cover.big { width: 64px; height: 90px; font-size: 28px; border-radius: 5px 10px 10px 5px; }

/* --- Računi, panel --- */
.bill-sum { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; min-width: 150px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat.red b { color: var(--red); }
.stat.goal { min-width: 180px; }
.stat.goal .bar { margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 6px 16px; margin-bottom: 22px; }
.bill-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.bill-row:first-child { border-top: 0; }
.bill-row .rt { flex: 1; min-width: 0; }
.bill-row .rt b { font-weight: 600; font-size: 14.5px; }
.bill-row .rt small { display: block; color: var(--muted); font-size: 12.5px; }
.bill-row .mini { opacity: .5; } .bill-row:hover .mini { opacity: 1; }

/* --- Kupovina --- */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.shop-list { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 16px 10px; animation: cardIn .45s var(--ease) both; }
.shop-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.shop-head h3 { margin: 0; flex: 1; font-size: 16px; font-weight: 650; }
.shop-head .n { color: var(--muted); font-size: 12.5px; }
.shop-add { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 0 10px; margin-bottom: 6px; border: 1px solid transparent; transition: border-color .15s, background .15s; }
.shop-add:focus-within { background: var(--surface); border-color: var(--line-2); }
.shop-add svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.shop-add input { border: 0 !important; background: transparent !important; box-shadow: none !important; padding: 10px 0; font-size: 15px; }
.sitems { list-style: none; margin: 0; padding: 0; }
.sitem { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 10px; cursor: pointer; transition: background .15s, opacity .3s, transform .3s var(--ease), max-height .3s var(--ease); max-height: 70px; overflow: hidden; animation: rise .25s var(--ease) both; }
.sitem:hover { background: var(--surface-2); }
.sitem .st { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.sitem .qty { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-3); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.sitem .mini { opacity: 0; }
.sitem:hover .mini { opacity: 1; }
@media (hover: none) { .sitem .mini { opacity: .55; } }
.sitem.bought .st { color: var(--muted); text-decoration: line-through; }
.sitem.gone { opacity: 0; transform: translateX(10px); max-height: 0; padding-top: 0; padding-bottom: 0; }
.bought-head { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 4px 4px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.bought-head button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; padding: 2px 6px; border-radius: 6px; }
.bought-head button:hover { color: var(--text); background: var(--surface-2); }
.bought-head .sp { flex: 1; }

/* --- Čitanje --- */
.read-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.book-card { display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; animation: cardIn .45s var(--ease) both; }
.book-card .rt { flex: 1; min-width: 0; display: grid; gap: 10px; align-content: start; }
.bk-top { display: flex; gap: 8px; }
.bk-top > div { flex: 1; min-width: 0; }
.bk-top b { display: block; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.bk-top small { color: var(--muted); font-size: 13px; }
.acts-inline { display: flex; }
.bk-prog { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bk-prog .bar { flex: 1; }
.bk-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bk-actions .sp { flex: 1; }
.page-in { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.page-in input { width: 80px !important; padding: 5px 8px !important; text-align: center; font-variant-numeric: tabular-nums; }
.stars { display: inline-flex; gap: 0; }
.stars button { border: 0; background: transparent; padding: 2px; color: var(--line-2); display: grid; transition: transform .15s var(--spring), color .15s; }
.stars button svg { width: 15px; height: 15px; }
.stars button.on { color: var(--text); }
.stars button.on svg { fill: currentColor; }
.stars:hover button { color: var(--muted); }
.stars button:hover ~ button { color: var(--line-2) !important; }
.stars button:hover { transform: scale(1.2); }
.yr { font-size: 12px; font-weight: 700; color: var(--text-2); padding: 12px 0 2px; letter-spacing: .04em; }
.yr span { color: var(--muted); font-weight: 500; margin-left: 6px; }
.bill-row.want .num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--text-2); flex: none; }
.bill-row .btn.sm svg { width: 12px; height: 12px; }

/* --- Odmor --- */
.vac-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.vac-card { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.vac-card:first-child { border-top: 0; }
.vac-card .badge { width: 52px; height: 52px; border-radius: 14px; background: var(--green-bg); color: var(--green); display: grid; place-items: center; text-align: center; line-height: 1.05; flex: none; }
.vac-card .badge b { font-size: 18px; display: block; }
.vac-card .badge small { font-size: 10.5px; text-transform: uppercase; }
.vac-card.past .badge { background: var(--past-bg); color: var(--muted); }
.vac-card .rt { flex: 1; min-width: 0; }
.vac-card .rt b { font-weight: 600; }
.vac-card .rt small { display: block; color: var(--muted); font-size: 12.5px; }
.vac-card.past .rt b { color: var(--muted); }
.form-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 8px; }
.form-card h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }

/* --- Pretraga --- */
.sr-group { margin-bottom: 22px; animation: rise .35s var(--ease) both; }
.sr-group h3 { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }
.sr-group h3 .n { color: var(--muted); font-weight: 500; }
.sr-list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 12px; }
.sr-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 8px; transition: background .15s; }
.sr-item:first-child { border-top: 0; }
.sr-item:hover { background: var(--surface-2); }
.sr-item > svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.sr-item .rt { flex: 1; min-width: 0; }
.sr-item .rt b { display: block; font-weight: 550; font-size: 14px; }
.sr-item .rt small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task.flash, .chapter.flash .ch-head { animation: flash 1.6s var(--ease); border-radius: 8px; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--text) 12%, transparent); } 100% { background: transparent; } }

/* --- Kalendar: računi, precrtani dani --- */
.cal-head .switch.xs { margin-left: auto; }
.cal-head h2 { margin-right: 0 !important; }
.day .ev.bill { color: var(--text-2); background: var(--surface-3); }
.day .ev.bill.red { color: var(--red); background: var(--red-bg); }
.day .ev.bill::before { content: "• "; }
.xpast .day.past::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background: linear-gradient(to top right, transparent calc(50% - .75px), var(--line-2) calc(50% - .75px), var(--line-2) calc(50% + .75px), transparent calc(50% + .75px)),
              linear-gradient(to bottom right, transparent calc(50% - .75px), var(--line-2) calc(50% - .75px), var(--line-2) calc(50% + .75px), transparent calc(50% + .75px));
  animation: fade .3s var(--ease) both;
}
.xpast .day.past .num { color: var(--muted); }

/* --- Donja kartica sa brojkama --- */
.stats-foot { display: flex; justify-content: center; margin: 40px 0 6px; }
.stats-card { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 22px; box-shadow: var(--shadow); animation: rise .5s var(--ease) .1s both; }
.st-i { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }

function buildClock() {
  const svg = $('#clock');
  let ticks = '';
  for (let i = 0; i < 12; i++) { const big = i % 3 === 0; ticks += `<line class="tk${big ? ' big' : ''}" x1="50" y1="${big ? 6 : 8}" x2="50" y2="${big ? 15 : 12}" transform="rotate(${i * 30} 50 50)"/>`; }
  svg.innerHTML = `<circle class="dial" cx="50" cy="50" r="48"/>${ticks}
    <path id="ch" class="h" d="M50 56 L50 28"/><path id="cm" class="m" d="M50 58 L50 16"/><line id="cs" class="s" x1="50" y1="60" x2="50" y2="14"/><circle class="pin" cx="50" cy="50" r="4"/><circle class="pin2" cx="50" cy="50" r="1.6"/>`;
  const h = $('#ch'), m = $('#cm'), sc = $('#cs');
  const tick = () => {
    const n = new Date(), sec = n.getSeconds(), min = n.getMinutes() + sec / 60, hr = (n.getHours() % 12) + min / 60;
    h.setAttribute('transform', `rotate(${hr * 30} 50 50)`);
    m.setAttribute('transform', `rotate(${min * 6} 50 50)`);
    sc.setAttribute('transform', `rotate(${sec * 6} 50 50)`);
    $('#dclock').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
    if (n.getHours() === 0 && n.getMinutes() === 0 && sec < 2) applyDate();
  };
  tick(); setInterval(tick, 1000);
  applyClock();
}

/* ===================== TOAST, MODAL ===================== */
function toast(msg, undo) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button">${t('Poništi')}</button>` : ''}`;
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstElementChild.remove();
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
  const tm = setTimeout(kill, undo ? 6000 : 2600);
  if (undo) el.querySelector('button').addEventListener('click', () => { clearTimeout(tm); undo(); kill(); });
}

async function bookDialog(book, cat, preStatus = 'want') {
  const rc = catsOf('reading');
  const st = book ? book.status : preStatus;
  const fields = [
    { name: 'title', label: t('Naslov'), required: true, value: book ? book.title : '', placeholder: t('npr. Na Drini ćuprija') },
    { name: 'author', label: t('Autor (opciono)'), value: book ? book.author : '', placeholder: t('npr. Ivo Andrić') },
    { name: 'status', label: t('Status'), type: 'select', value: st, options: [{ value: 'reading', label: t('Čitam') }, { value: 'want', label: t('Sledeće za čitanje') }, { value: 'done', label: t('Pročitano') }] }];
    if (book && book.status === 'done') fields.push({ row: [{ name: 'finished', label: t('Završeno'), type: 'date', value: book.finished },
      { name: 'rating', label: t('Ocena'), type: 'select', value: String(book.rating || 0), options: [0, 1, 2, 3, 4, 5].map(n => ({ value: String(n), label: n ? '★'.repeat(n) + '☆'.repeat(5 - n) : t('Bez ocene') })) }] });
  if (rc.length > 1 && !book) fields.push({ name: 'cat', label: t('Kategorija'), type: 'select', value: (cat || rc[0]).id, options: rc.map(c => ({ value: c.id, label: c.name })) });
  const v = await ask({ title: book ? t('Izmeni knjigu') : t('Nova knjiga'), ok: book ? t('Sačuvaj') : t('Dodaj'), fields });
  if (!v || !v.title) return;
  const pages = book ? book.pages || 0 : 0;
  if (book) {
    const was = book.status;
    Object.assign(book, { title: v.title, author: v.author, pages, status: v.status });
      if (v.finished) book.finished = v.finished;
      if (v.rating !== undefined) book.rating = +v.rating || 0;
    if (v.status === 'done' && was !== 'done') { book.finished = book.finished || todayStr(); if (pages) book.page = pages; }
    if (v.status === 'reading' && was !== 'reading') book.started = book.started || todayStr();
  } else {
    const target = (v.cat && catById(v.cat)) || cat || ensureType('reading');
    target.books.push({ id: uid(), title: v.title, author: v.author, pages, page: v.status === 'done' ? pages : 0, status: v.status, added: todayStr(),
      started: v.status === 'reading' ? todayStr() : '', finished: v.status === 'done' ? todayStr() : '', rating: 0 });
  }
  commit();
  toast(book ? t('Izmenjeno') : t('Knjiga dodata'));
}

const sortCards = (cards) => {
  const idx = new Map(cards.map((c, i) => [c, i]));
  return [...cards].sort((x, y) => {
    const dx = isCardDone(x), dy = isCardDone(y);
    if (dx !== dy) return dx ? 1 : -1;
    if (prefs.cardSort === 'name') return x.title.localeCompare(y.title, LOC());
    if (prefs.cardSort === 'due') {
      if (x.deadline && y.deadline && x.deadline !== y.deadline) return x.deadline.localeCompare(y.deadline);
      if (!!x.deadline !== !!y.deadline) return x.deadline ? -1 : 1;
    }
    return idx.get(x) - idx.get(y);
  });
};

drawer.addEventListener('keydown', (e) => {
  const el = e.target;
  const f = findCard(drawerId); if (!f) return;
  const { card } = f;
  if (el.matches('.dr-title') && e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
  if (el.tagName !== 'INPUT') return;
  if (e.key === 'Enter' && el.dataset.add) {
    e.preventDefault();
    const text = el.value.trim(); if (!text) return;
    if (el.dataset.add === 'chapter') {
      const id = uid(); card.chapters.push({ id, title: text, tasks: [] });
      commit(); renderDrawer({ static: true, focus: `[data-add="task"][data-ch="${id}"]` });
    } else {
      const ch = card.chapters.find(c => c.id === el.dataset.ch);
      ch.tasks.push({ id: uid(), text, done: false });
      commit(); renderDrawer({ static: true, focus: `[data-add="task"][data-ch="${ch.id}"]` });
    }
    return;
  }
  if (el.matches('.t-text')) {
    const ch = card.chapters.find(c => c.id === el.dataset.ch);
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); $(`[data-add="task"][data-ch="${ch.id}"]`, drawer)?.focus(); }
    if (e.key === 'Backspace' && el.value === '') {
      e.preventDefault();
      const idx = ch.tasks.findIndex(x => x.id === el.dataset.task);
      ch.tasks.splice(idx, 1);
      const prev = ch.tasks[idx - 1];
      commit(); renderDrawer({ static: true, focus: prev ? `.t-text[data-task="${prev.id}"]` : `[data-add="task"][data-ch="${ch.id}"]` });
    }
    return;
  }
  if (el.matches('.ch-title') && e.key === 'Enter') { e.preventDefault(); el.blur(); }
});

function menuAction(a) {
  if (a === 'unpair' && confirm(t('Odjaviti se? Podaci ostaju na nalogu, a sa ovog uređaja se brišu.'))) unpair('');
  if (a === 'delacc') deleteAccount();
  if (a === 'login') { localStorage.removeItem('platom-guest'); location.reload(); }
  if (a === 'wipe' && confirm(t('Obrisati sve podatke sa ovog uređaja? Preporuka: prvo preuzmi rezervnu kopiju.'))) { wipeLocal(); location.reload(); }
  if (a === 'privacy') privacyDialog();
  if (a === 'onb') onboarding();
  if (a === 'keys') keysDialog();
  if (a === 'week') { weekForce = true; if (view !== 'focus') setView('focus'); else renderView(false); }
  if (a === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `platom-${todayStr()}.json` });
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    toast(t('Rezervna kopija preuzeta'));
  }
  if (a === 'import') {
    const inp = Object.assign(document.createElement('input'), { type: 'file', accept: 'application/json,.json' });
    inp.onchange = async () => {
      try { const data = normalize(JSON.parse(await inp.files[0].text())); withUndo(t('Rezervna kopija učitana'), () => { state = data; }); }
      catch { toast(t('Fajl nije ispravan')); }
    };
    inp.click();
  }
}

function onboarding() {
  const S = [
    [ICON.target, t('Fokus'), t('Ujutru izaberi šta želiš da završiš danas. Pomodoro ti pomaže da ostaneš u fokusu, a sve završeno se skuplja na dnu.')],
    [ICON.home, t('Planer'), t('Sve na jednom mestu: obaveze, kupovina, novac, odmor, navike i važni datumi. Svaka kategorija ima svoje vidžete sa strane.')],
    [ICON.cal, t('Kalendar'), t('Rokovi, računi, odmori i važni datumi na jednom mestu. Klikni na bilo koji dan da nešto dodaš.')],
    [ICON.plus, t('Brzo dodavanje'), t('Pritisni N bilo gde da dodaš nešto novo, / za pretragu, a strelice ← → za prelazak između tabova.')]];
  let i = 0;
  const el = document.createElement('div'); el.className = 'onb'; el.setAttribute('role', 'dialog');
  const draw = (dir) => {
    el.innerHTML = `<div class="onb-card"><div class="onb-slide ${dir || ''}"><span class="onb-ic">${S[i][0]}</span><h2>${S[i][1]}</h2><p>${S[i][2]}</p></div>
      <div class="onb-dots">${S.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="onb-act"><button type="button" class="btn ghost" data-o="skip">${t('Preskoči')}</button><button type="button" class="btn primary" data-o="next">${i === S.length - 1 ? t('Počni') : t('Dalje')}</button></div></div>`;
  };
  const close = () => { localStorage.setItem('platom-onb', '1'); el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  el.addEventListener('click', (e) => { const b = e.target.closest('[data-o]'); if (!b) return; if (b.dataset.o === 'skip' || i === S.length - 1) close(); else { i++; draw('next'); } });
  el.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  draw(); document.body.appendChild(el); setTimeout(() => el.querySelector('[data-o="next"]')?.focus(), 50);
}
function keysDialog() {

async function notifToggle(inp) {
  if (!('Notification' in window)) { inp.checked = false; toast(t('Ovaj pregledač ne podržava obaveštenja.')); return; }
  if (!inp.checked) { prefs.notif = false; savePrefs(); toast(t('Podsetnici isključeni')); return; }
  const p = await Notification.requestPermission();
  if (p !== 'granted') { inp.checked = false; prefs.notif = false; savePrefs(); toast(t('Obaveštenja nisu dozvoljena u pregledaču.')); return; }
  prefs.notif = true; savePrefs(); localStorage.removeItem('platom-sent'); toast(t('Podsetnici uključeni')); checkNotify();
}
function dueSummary() {
  const td0 = todayStr(), tm = ymd(addDays(new Date(), 1)), out = [];
  for (const { card } of allCards()) if (card.deadline && !isCardDone(card) && card.deadline <= tm) out.push(`${card.title} – ${card.deadline < td0 ? t('kasni') : card.deadline === td0 ? t('danas') : t('sutra')}`);
  for (const o of billOcc(tm)) if (!o.paid) out.push(`${o.bill.name}${o.bill.amount ? ' · ' + amountTxt(o.bill.amount) : ''} – ${o.date < td0 ? t('kasni') : o.date === td0 ? t('danas') : t('sutra')}`);
  for (const { ev } of allEvents()) { const d = evNext(ev); if (d === td0 || d === tm) out.push(`${ev.title} – ${d === td0 ? t('danas') : t('sutra')}`); }
  return out;
}
async function checkNotify() {
  if (!prefs.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  const td0 = todayStr(); if (new Date().getHours() < 7 || localStorage.getItem('platom-sent') === td0) return;
  const items = dueSummary(); localStorage.setItem('platom-sent', td0);
  if (!items.length) return;
  const title = t('Platom · {n} za danas i sutra', { n: items.length }), opts = { body: items.slice(0, 5).join('\n') + (items.length > 5 ? '\n…' : ''), icon: 'icon.svg', badge: 'icon.svg', tag: 'platom-' + td0 };
  let reg = null; try { reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null; } catch (e) {}
  try { if (reg) await reg.showNotification(title, opts); else new Notification(title, opts); } catch (e) {}
}

  const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 650); }

  applyStatic(); applyColor(); applyBar(); applyDate(); applyAlign();
  const ind = $('.seg-ind'); ind.style.transition = 'none';
  moveInd(); requestAnimationFrame(() => { ind.style.transition = ''; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
  renderView(true);
  scheduleSave(0);
  if (!localStorage.getItem('platom-onb')) setTimeout(onboarding, 500);
  setTimeout(checkNotify, 2500); setInterval(checkNotify, 30 * 60000);
  appReady = true; uiPush();

  setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); renderView(false); } }, 60000);
}

  'auth/email-already-in-use': t('Nalog sa ovom e-poštom već postoji – prijavi se.'), 'auth/weak-password': t('Šifra mora imati najmanje 8 znakova.'), 'auth/invalid-email': t('E-pošta nije ispravna.'),

function showAuth(msg) {
  const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 650); }
  const L0 = $('#login'), form = $('#login-form'), out = $('#login-msg'), btn = $('#login-btn');

  L0.hidden = false; out.textContent = msg || '';
  const setMode = (m) => { mode = m; L0.classList.toggle('up', m === 'up'); $$('[data-am]', L0).forEach(b => b.classList.toggle('on', b.dataset.am === m));
    btn.textContent = m === 'up' ? t('Napravi nalog') : t('Prijavi se'); $('#login-pass').autocomplete = m === 'up' ? 'new-password' : 'current-password'; out.textContent = ''; };
    $$('[data-am]', L0).forEach(b => b.addEventListener('click', () => setMode(b.dataset.am)));
    const ls = $('#auth-lang'); ls.innerHTML = LANGS.map(([k, l]) => `<option value="${k}"${L() === k ? ' selected' : ''}>${l}</option>`).join('');
    ls.addEventListener('change', () => { prefs.lang = ls.value; localStorage.setItem('planer-prefs', JSON.stringify(prefs)); translateAuth(); setMode(mode); });

(async function init() {

      try { if (await tryRemembered()) { ONLINE = true; startApp(); return; } }
      catch (e) { if (e && e.message === 'decrypt') localStorage.removeItem('planer-key'); else { startApp(); setStatus(t('Bez veze – radi na ovom uređaju')); return; } }
