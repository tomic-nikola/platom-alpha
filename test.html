<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platom – provera naloga</title>
<style>
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px 18px 60px; color: #111; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #666; margin: 0 0 20px; font-size: 14px; }
  .box { background: #fff; border: 1px solid #e3e3e3; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; border-top: 1px solid #f0f0f0; }
  .row:first-child { border-top: 0; }
  .ok { color: #15803d; font-weight: 600; } .bad { color: #dc2626; font-weight: 600; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { flex: 1; padding: 11px; font-size: 15px; border-radius: 10px; border: 0; background: #111; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #111; border: 1px solid #ccc; }
  #log { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #111; color: #e5e5e5; border-radius: 12px; padding: 14px; min-height: 60px; }
</style>
<script src="config.js"></script>
</head>
<body>
  <h1>Provera naloga</h1>
  <p class="sub">Ova stranica proverava Firebase podešavanje i ispisuje tačnu grešku.</p>

  <div class="box" id="cfg"></div>

  <div class="box">
    <label for="em">E-pošta</label>
    <input id="em" type="email" autocomplete="username" placeholder="ime@primer.rs">
    <label for="pw">Šifra (najmanje 8 znakova)</label>
    <input id="pw" type="password" autocomplete="new-password">
    <div class="btns">
      <button type="button" id="up">Napravi nalog</button>
      <button type="button" id="in" class="ghost">Prijavi se</button>
    </div>
  </div>

  <div id="log">Rezultat će se pojaviti ovde.</div>

<script type="module">
const log = document.getElementById('log');
const say = (t) => { log.textContent += '\n' + t; };
const cfg = window.PLATOM_FIREBASE || {};

const row = (k, v, good) => `<div class="row"><span>${k}</span><span class="${good ? 'ok' : 'bad'}">${v}</span></div>`;
const key = cfg.apiKey || '';
document.getElementById('cfg').innerHTML =
  row('config.js učitan', window.PLATOM_FIREBASE ? 'da' : 'NE', !!window.PLATOM_FIREBASE) +
  row('apiKey', key ? (key.startsWith('AIza') ? `počinje sa AIza, ${key.length} znakova` : `pogrešan: „${key.slice(0, 12)}…“`) : 'prazan', key.startsWith('AIza') && key.length === 39) +
  row('authDomain', cfg.authDomain || 'prazan', !!cfg.authDomain) +
  row('projectId', cfg.projectId || 'prazan', !!cfg.projectId) +
  row('appId', cfg.appId ? 'upisan' : 'prazan', !!cfg.appId) +
  row('Ova adresa', location.hostname || '(lokalni fajl)', !!location.hostname);

let fb = null;
async function load() {
  if (fb) return fb;
  log.textContent = 'Učitavam Firebase…';
  const v = '10.12.2';
  const app = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const auth = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
  const a = app.initializeApp(cfg);
  fb = { auth, fs, A: auth.getAuth(a), D: fs.getFirestore(a) };
  say('Firebase učitan.');
  return fb;
}

async function run(signup) {
  const email = document.getElementById('em').value.trim();
  const pass = document.getElementById('pw').value;
  if (!email || pass.length < 8) { log.textContent = 'Upiši e-poštu i šifru od najmanje 8 znakova.'; return; }
  try {
    const { auth, fs, A, D } = await load();
    say(signup ? 'Pravim nalog…' : 'Prijavljujem…');
    const cred = signup ? await auth.createUserWithEmailAndPassword(A, email, pass) : await auth.signInWithEmailAndPassword(A, email, pass);
    say('✔ NALOG RADI. Korisnik: ' + cred.user.email);
    say('Proveravam bazu…');
    await fs.getDoc(fs.doc(D, 'planners', cred.user.uid));
    say('✔ BAZA RADI. Sve je podešeno.');
  } catch (e) {
    say('✖ GREŠKA: ' + (e.code || '') );
    say(e.message || String(e));
  }
}
document.getElementById('up').addEventListener('click', () => run(true));
document.getElementById('in').addEventListener('click', () => run(false));
</script>
</body>
</html>
